[package]
name = "motion-companion"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "motion_companion"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[dependencies]
anchor-lang = "0.29"
anchor-spl = "0.29"
solana-program = "1.18"

[patch.crates-io]
solana-program = { version = "1.18" }
